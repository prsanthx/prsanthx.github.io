<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Prasanth Muntha</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #0a0a0a;
            color: #f5f5f5;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        /* Subtle geometric background */
        .bg-shapes {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.06;
        }
        .bg-shapes::before,
        .bg-shapes::after {
            content: '';
            position: absolute;
            border: 1px solid #f5f5f5;
        }
        .bg-shapes::before {
            width: 300px;
            height: 300px;
            top: 10%;
            left: 5%;
            transform: rotate(15deg);
            animation: float 8s ease-in-out infinite;
        }
        .bg-shapes::after {
            width: 200px;
            height: 200px;
            bottom: 15%;
            right: 10%;
            transform: rotate(-20deg);
            animation: float 10s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: rotate(15deg) translateY(0); }
            50% { transform: rotate(15deg) translateY(-20px); }
        }
        .card {
            position: relative;
            max-width: 480px;
            width: 100%;
            padding: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.02);
            text-align: center;
        }
        .card::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(90deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.3) 100%);
            background-size: 200% 100%;
            animation: borderFlow 4s linear infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 2px;
            pointer-events: none;
        }
        @keyframes borderFlow {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .logo {
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #888;
            margin-bottom: 2rem;
        }
        .logo .dot {
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .code {
            font-family: 'Space Mono', monospace;
            font-size: clamp(5rem, 15vw, 8rem);
            font-weight: 700;
            line-height: 0.9;
            margin: 0 0 0.5rem;
            letter-spacing: -0.05em;
            background: linear-gradient(180deg, #f5f5f5 0%, rgba(245,245,245,0.6) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .label {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #888;
            margin-bottom: 1.5rem;
        }
        .msg {
            font-size: 1rem;
            color: #888;
            margin: 0 0 2rem;
            line-height: 1.6;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.9rem 1.6rem;
            border: 1px solid #f5f5f5;
            background: #f5f5f5;
            color: #0a0a0a;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: transparent;
            color: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="bg-shapes" aria-hidden="true"></div>
    <div class="card">
        <p class="logo">PM<span class="dot">.</span></p>
        <p class="code">404</p>
        <p class="label">Not found</p>
        <p class="msg">This page doesn’t exist. Broken link or wrong URL — head back and try again.</p>
        <a href="/" class="btn">← Back to home</a>
    </div>
</body>
</html>
